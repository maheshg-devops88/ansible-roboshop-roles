
  - name: Enable and install nodejs 
    ansible.builtin.include_role: 
      name: common 
      tasks_from: nodejs_install.yaml
       
  - name: Create roboshop user 
    ansible.builtin.include_role:
       name: common 
       tasks_from: roboshop_user.yaml

  - name: delete existing and create new app dir 
    ansible.builtin.include_role: 
      name: common 
      tasks_from: app_dir.yaml
 
  - name: delete and get the {{ component }} code 
    ansible.builtin.include_role: 
      name: common 
      tasks_from: app_code.yaml

  - name: Install npm
    community.general.npm:
      path: /app
      state: latest

  - name: Copy mongo.repo file to /etc/yum.repos.d/mongo.repo
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/

  - name: Install mongodb-mongosh
    ansible.builtin.dnf:
      name: mongodb-mongosh
      state: present

  - name: load master data to mongodb 
    ansible.builtin.command: mongosh --host "{{ MONGODB_HOST }}" --quiet  --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
    register: catalogue_output

  - name: print the catalogue_output
    ansible.builtin.debug:
      msg: "{{ catalogue_output }}"

  - name: load the products
    ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" </app/db/master-data.js
    when: catalogue_output.stdout  | int < 0

  - name: copy {{ component }} service to /etc/systemd/system/{{ component }}.service
    ansible.builtin.template:
      src: catalogue.service.j2
      dest: /etc/systemd/system/catalogue.service
    notify:
      - catalogue daemon reload
      - start catalogue service

